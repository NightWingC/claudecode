<!DOCTYPE html>
<html>
<head>
  <title>Contador</title>
  <style>
    body { background: #2b2b2b; color: #f0f0f0; font-family: sans-serif; }
    button { background: #333; color: #f0f0f0; border: 1px solid #555; padding: 4px 12px; cursor: pointer; }
  </style>
</head>
<body>
  <p id="count">0</p>
  <button onclick="document.getElementById('count').textContent++">+</button>
  <button onclick="document.getElementById('count').textContent--">-</button>
</body>
</html>
